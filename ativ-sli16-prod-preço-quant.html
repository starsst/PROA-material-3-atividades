<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Atividade de Tabelas</title>
  
  <!-- CSS para colocar as bordas pretas e a tabela não ficar parecendo uma lista solta -->
  <style>
    table, td, th {
        border: 1px solid black;
    }
  </style>
</head>
<body>

  <!-- table abre a estrutura da tabela inteira -->
  <table>
    
    <!-- primeira linha:th para os títulos das 3 colunas -->
    <tr>
      <th>Produto</th>
      <th>Preço</th>
      <th>Quantidade</th>
    </tr>

    <tr>
      <td>Notebook</td>
      <td>R$ 3.500,00</td>
      <td>5</td>
    </tr>

    <tr>
      <td>Iphone 13 128GBr</td>
      <td>R$ 3.600,00</td>
      <td>8</td>
    </tr>

    <tr>
      <td>Caderno Inteligente Grande</td>
      <td>R$ 120,00</td>
      <td>15</td>
    </tr>

    <tr>
      <td>Garrafa Térmica Stanley</td>
      <td>R$ 260,00</td>
      <td>10</td>
    </tr>

    <tr>
      <td>Tênis Nike Air Force 1</td>
      <td>R$ 800,00</td>
      <td>12</td>
    </tr>

    <tr>
      <td>Teclado</td>
      <td>R$ 80,00</td>
      <td>5</td>
    </tr>

    <tr>
      <td>Mouse</td>
      <td>R$ 50,00</td>
      <td>10</td>
    </tr>

  </table>

</body>
</html>
