<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade Prática - Vendas</title>
  <style>
    table, td, th {
        border: 1px solid black;
    }
  </style>
</head>
<body>

  <table>
    <thead>
      <tr>
        <th>Produto</th>
        <th>Vendas</th>
        <th>Meta</th>
      </tr>
    </thead>
    
    <tbody>
      <tr>
        <td>Notebook</td>
        <td>15</td>
        <td>20</td>
      </tr>
      <tr>
        <td>Celular</td>
        <td>25</td>
        <td>30</td>
      </tr>
      <tr>
        <td>Fone Bluetooth</td>
        <td>40</td>
        <td>40</td>
      </tr>
    </tbody>
    
    <tfoot>
      <tr>
        <td>Total</td>
        <td colspan="2">80 unidades vendidas</td>
      </tr>
    </tfoot>
  </table>

</body>
</html>
